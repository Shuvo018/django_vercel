{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content --> 
    <div class="col-md-9">
        <h2>All categories</h2>
        <a href="{% url 'add_categories' %}" class="btn btn-dark text-light float-right mb-4">Add Category</a>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Category Name</th>
                    <th scope="col">Created At</th>
                    <th scope="col">Updated At</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- categories comming from context_processors -->
                {% for cat in categories %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ cat }}</td>
                    <td>{{ cat.created_at }}</td>
                    <td>{{ cat.updated_at }}</td>
                    <td>
                        <a href="{% url 'edit_category' cat.id %}"><i class="fa fa-edit text-success"></i></a>
                        &nbsp;
                        <a href="{% url 'delete_category' cat.id %}"><i class="fa fa-trash  text-danger"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>


</div>

{% endblock %}
